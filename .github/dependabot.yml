version: 2
updates:
  # Automated dependency updates for Rust (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase

  # Automated dependency updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Automated dependency updates for npm (TypeScript bindings)
  - package-ecosystem: "npm"
    directory: "/bindings"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Automated dependency updates for npm (Event indexer)
  - package-ecosystem: "npm"
    directory: "/indexer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5