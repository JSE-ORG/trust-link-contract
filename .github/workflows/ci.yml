name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --retries 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --workspace --release
      - run: cargo build --workspace --release --target wasm32v1-none

  snapshot-guard:
    name: Snapshot Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Regenerate snapshots
        run: cargo test -p trustlink-escrow
      - name: Fail if snapshots are dirty
        run: |
          git diff --exit-code contracts/escrow/test_snapshots || {
            echo "Snapshot drift detected. Run 'cargo test -p trustlink-escrow' locally and commit the updated snapshots."
            exit 1
          }
      - uses: taiki-e/install-action@nextest
      - name: Regenerate snapshots
        run: cargo nextest run --workspace --retries 1
      - name: Fail if snapshots are dirty
        run: |
          if ! git diff --quiet -- contracts/escrow/test_snapshots; then
            echo "Snapshot drift detected. Commit the following changes:"
            git diff -- contracts/escrow/test_snapshots
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true

  wasm-size-check:
    name: WASM Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build WASM binary
        run: cargo build --target wasm32v1-none -p trustlink-escrow --release
      - name: Check WASM binary size
        run: |
          WASM_FILE="target/wasm32v1-none/release/trustlink_escrow.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -f%z "$WASM_FILE" 2>/dev/null || stat -c%s "$WASM_FILE" 2>/dev/null || wc -c < "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "✓ WASM binary size: ${SIZE_KB} KB (${SIZE} bytes)"
            # Warn if exceeds 1MB
            if [ "$SIZE" -gt 1048576 ]; then
              echo "⚠ Warning: WASM binary exceeds 1MB"
            fi
          else
            echo "✗ WASM binary not found at $WASM_FILE"
            exit 1
          fi

  fuzz:
    name: Fuzz (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build fuzz targets
        run: |
          cd contracts/escrow/fuzz
          cargo build --release --bins
