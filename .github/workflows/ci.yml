name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32v1-none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --lib -- -D warnings

      - name: Run tests
        run: cargo test --lib

  error-codes:
    name: errors.rs <-> errors.ts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check ErrorCode enum is in sync
        run: node scripts/check-error-codes.mjs

  indexer:
    name: indexer typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-wasm:
    name: build wasm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32v1-none

      - name: Build contract wasm
        run: cargo build --target wasm32v1-none --release

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: trustlink-escrow-wasm
          path: target/wasm32v1-none/release/*.wasm
