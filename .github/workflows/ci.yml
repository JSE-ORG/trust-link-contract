name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Check
        run: make fmt-check
      - name: Audit Scope Drift Check
        run: |
          # AUDIT_SCOPE.md is canonical; guard against audit/ duplicate
          if [ -d "audit" ] && [ -f "audit/SCOPE.md" ]; then
            echo "Error: Duplicate audit scope file detected at audit/SCOPE.md. AUDIT_SCOPE.md is canonical."
            exit 1
          fi
      - name: Clippy
        run: make clippy
      - name: Test
        run: make test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build WASM
        run: make build-wasm
