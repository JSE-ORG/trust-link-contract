name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Check
        run: make fmt-check
      # Canonical lint scope — identical to the pre-commit hook (issue #1102).
      - name: Audit Scope Drift Check
        run: |
          # AUDIT_SCOPE.md is canonical; guard against audit/ duplicate
          if [ -d "audit" ] && [ -f "audit/SCOPE.md" ]; then
            echo "Error: Duplicate audit scope file detected at audit/SCOPE.md. AUDIT_SCOPE.md is canonical."
            exit 1
          fi
      - name: Clippy
        run: make clippy
      - name: Build (lib)
        run: make build-debug
      - name: Test (unit, lib)
        run: make test
      - name: "Test (all targets: unit + integration)"
        run: make test-all
      - name: Fuzz targets (type-check)
        run: make fuzz-check
      - name: Xtask (fmt + clippy + test)
        run: make xtask-test

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: indexer
      - name: Typecheck and test
        run: make indexer-test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build WASM
        run: make build-wasm

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build contract
        run: cargo build --lib
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./bindings
        run: npm ci
      - name: Typecheck bindings
        working-directory: ./bindings
        run: npm run typecheck
      - name: Test bindings
        working-directory: ./bindings
        run: npm test

  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build contract
        run: cargo build --lib
      - name: Test xtask
        run: make xtask-test

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build contract
        run: cargo build --lib
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./indexer
        run: npm ci
      - name: Typecheck indexer
        working-directory: ./indexer
        run: npm run typecheck
      - name: Test indexer
        working-directory: ./indexer
        run: npm test
