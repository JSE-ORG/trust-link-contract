name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: '0 0 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32v1-none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --lib -- -D warnings

      - name: Run tests
        run: cargo test --lib

  build-wasm:
    name: build wasm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32v1-none

      - name: Build contract wasm
        run: cargo build --target wasm32v1-none --release

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: trustlink-escrow-wasm
          path: target/wasm32v1-none/release/*.wasm

  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: rustup default nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzing
        run: |
          cd contracts/escrow
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TIME=60
          else
            TIME=10
          fi
          for target in auto_release cancel_escrow confirm_delivery create_escrow fund_escrow mark_shipped raise_dispute resolve_dispute; do
            cargo +nightly fuzz run "$target" -- -max_total_time=$TIME
          done
