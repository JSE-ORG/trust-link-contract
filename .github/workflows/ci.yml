name: CI
on: [push, pull_request]

# Note on E2E integration test exclusion (Issue #1168):
# The `make e2e` target (e2e/01_setup_and_deploy.sh - e2e/04_cancel_path.sh) is intentionally
# excluded from this CI workflow. The e2e scripts run live transactions against an active Stellar
# network (defaulting to STELLAR_NETWORK=testnet or a local Docker Quickstart container) and require
# external dependencies (stellar CLI, jq, Friendbot funding). Running e2e against the public testnet
# in CI is excluded to prevent flaky failures from public network rate limits, latency, or resets.
# Running against local dockerized quickstart is excluded to keep CI runs fast and lightweight.
# Deterministic end-to-end contract protocol verification is instead enforced in CI via `make test-all`
# (contracts/escrow/tests/*), which exercises multi-step integration flows in-memory without external network dependencies.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Check
        run: make fmt-check
      # Canonical lint scope — identical to the pre-commit hook (issue #1102).
      - name: Audit Scope Drift Check
        run: |
          # AUDIT_SCOPE.md is canonical; guard against audit/ duplicate
          if [ -d "audit" ] && [ -f "audit/SCOPE.md" ]; then
            echo "Error: Duplicate audit scope file detected at audit/SCOPE.md. AUDIT_SCOPE.md is canonical."
            exit 1
          fi
      - name: Clippy
        run: make clippy
      - name: Build (lib)
        run: make build-debug
      - name: Test (unit, lib)
        run: make test
      - name: Test (all targets: unit + integration)
        run: make test-all
      - name: Fuzz targets (type-check)
        run: make fuzz-check
      - name: Xtask (fmt + clippy + test)
        run: make xtask-test

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: indexer
      - name: Typecheck and test
        run: make indexer-test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build WASM
        run: make build-wasm
