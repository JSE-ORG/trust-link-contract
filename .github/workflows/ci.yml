name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Check
        run: make fmt-check
      # Canonical lint scope — identical to the pre-commit hook (issue #1102).
      - name: Audit Scope Drift Check
        run: |
          # AUDIT_SCOPE.md is canonical; guard against audit/ duplicate
          if [ -d "audit" ] && [ -f "audit/SCOPE.md" ]; then
            echo "Error: Duplicate audit scope file detected at audit/SCOPE.md. AUDIT_SCOPE.md is canonical."
            exit 1
          fi
      - name: CI Check Parity
        run: make check-ci-parity
      - name: Clippy
        run: make clippy
      - name: Build (lib)
        run: make build-debug
      - name: Run canonical check target (fmt + clippy + test + error-codes + CI parity)
        run: make check
      - name: "Test (all targets: unit + integration)"
        run: make test-all
      - name: Fuzz targets (type-check)
        run: make fuzz-check
      - name: Xtask (fmt + clippy + test)
        run: make xtask-test

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: indexer
      - name: Typecheck and test
        run: make indexer-test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build WASM
        run: make build-wasm

  snapshot-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Regenerate snapshots
        run: make test-all
      - name: Check for snapshot drift
        run: |
          if [ -n "$(git status --porcelain contracts/escrow/test_snapshots/)" ]; then
            echo "Error: Snapshot drift detected. The following snapshot files have changed:"
            git status --porcelain contracts/escrow/test_snapshots/
            echo ""
            echo "To fix: Run 'make test-all' locally and commit the updated snapshots."
            echo "See CONTRIBUTING.md section 'Snapshot Files' for details."
            exit 1
          fi
        working-directory: contracts/escrow
