# cargo-deny configuration — supply-chain policy for trust-link-contract.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Pull the RustSec advisory DB from the default source. A known *vulnerability*
# fails `cargo deny check advisories` (and therefore CI). Add RUSTSEC ids here,
# with a justification, only to temporarily accept an unavoidable advisory.
ignore = []
yanked = "deny"
# Only fail on unmaintained crates we actually own (workspace deps). Deep,
# unavoidable transitive crates (e.g. `paste`, pulled in via soroban-sdk) would
# otherwise break every PR without being a security risk. Vulnerabilities are
# still denied regardless of this setting.
unmaintained = "workspace"

[licenses]
# Permissive licenses common across the Rust / Soroban ecosystem.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# Don't license-check the workspace's own (unpublished) crates.
[licenses.private]
ignore = true

[bans]
# Duplicate versions are common in transitive trees; surface but don't fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
