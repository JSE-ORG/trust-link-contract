# cargo-deny configuration — supply-chain policy for trust-link-contract.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Pull the RustSec advisory DB from the default source. A known *vulnerability*
# fails `cargo deny check advisories` (and therefore CI). Add RUSTSEC ids here,
# with a justification, only to temporarily accept an unavoidable advisory.
ignore = [
  # RUSTSEC-2026-0387 (crypto-bigint 0.5.5, constant-time timing variability).
  # The patched release (>=0.7.6) cannot be adopted: crypto-bigint is only
  # reached through k256/p256/elliptic-curve 0.13 -> soroban-env-host, and even
  # the latest soroban-env-host (30.x) still requires elliptic-curve ^0.13,
  # which needs crypto-bigint ^0.5. It exists only in the host-side test/
  # simulation tree (soroban-sdk `testutils`) and is NOT compiled into the
  # deployed wasm contract, which handles no secret integers. Remove this
  # entry once soroban-env-host moves to elliptic-curve 0.14 (crypto-bigint 0.7).
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.7.6 blocked by soroban-env-host's elliptic-curve 0.13 pin; host-side testutils only, not in wasm" },
]
yanked = "deny"
# Only fail on unmaintained crates we actually own (workspace deps). Deep,
# unavoidable transitive crates (e.g. `paste`, pulled in via soroban-sdk) would
# otherwise break every PR without being a security risk. Vulnerabilities are
# still denied regardless of this setting.
unmaintained = "workspace"

[licenses]
# Permissive licenses common across the Rust / Soroban ecosystem.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# Don't license-check the workspace's own (unpublished) crates.
[licenses.private]
ignore = true

[bans]
# Duplicate versions are common in transitive trees; surface but don't fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
