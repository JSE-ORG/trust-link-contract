[package]
name = "trustlink-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Exposes the Soroban test utilities (contract registration, mock auth) to
# downstream native consumers such as the fuzz harnesses in `fuzz/`.
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
